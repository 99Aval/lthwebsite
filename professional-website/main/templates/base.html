{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Professional Website</title>
</head>
<body>
    <header>
    <nav class="navbar">
        <a href="{% url 'home' %}" class="logo">
            <img src="{% static 'logos/main_logo.jpg' %}" alt="Logo" style="height:40px;">
        </a>
    </nav>
</header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
   <footer style="background: #000; color: #fff; padding: 30px 0;">
    <div class="footer-container" style="display: flex; justify-content: space-between; align-items: flex-start; max-width: 1100px; margin: 0 auto;">
        <!-- Left Side: Shop Info & Social -->
        <div class="footer-left" style="flex: 1; text-align: left;">
            <div class="footer-logos" style="margin-bottom: 18px;">
                <a href="https://wa.me/yourwhatsappphonenumber" target="_blank" style="margin-right: 12px;">
                    <img src="{% static 'logos/whatsapp.png' %}" alt="WhatsApp" style="height:32px;">
                </a>
                <a href="https://facebook.com/yourfacebookpage" target="_blank" style="margin-right: 12px;">
                    <img src="{% static 'logos/facebook.png' %}" alt="Facebook" style="height:32px;">
                </a>
            </div>
            <div class="footer-details">
                <div><strong>Shop Name:</strong> DLG </div>
                <div><strong>Location:</strong> Dharan Rd, Biratnagar</div>
                <div><strong>Phone:</strong> +91-9852021669</div>
                <div><strong>Email:</strong> ndmbrt@gmail.com</div>
            </div>
        </div>
        <!-- Right Side: Contact Form -->
        <div class="footer-right" style="flex: 1; display: flex; flex-direction: column; align-items: center;">
            <span style="font-weight: bold; margin-bottom: 8px; align-self: center;">Contact Us:</span>
            <form method="post" action="{% url 'footer_contact' %}" style="margin-bottom: 10px; width: 100%; display: flex; flex-direction: column; align-items: center;">
                {% csrf_token %}
                <input type="email" id="footer-email" name="email" placeholder="Your email" required style="width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none;">
                <textarea name="message" placeholder="Your message" required style="width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none; min-height: 60px;"></textarea>
                <button type="submit" style="padding: 10px 22px; border-radius: 6px; background: #FFD600; color: #222; font-weight: bold; border: none; margin: 0 auto;">Send</button>
            </form>
        </div>
    </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function() {
    function reveal() {
        var elements = document.querySelectorAll('.fade-in');
        for (var i = 0; i < elements.length; i++) {
            var windowHeight = window.innerHeight;
            var elementTop = elements[i].getBoundingClientRect().top;
            if (elementTop < windowHeight - 60) {
                elements[i].classList.add('visible');
            }
        }
    }
    window.addEventListener("scroll", reveal);
    reveal();
});
</script>
</body>
</html>
