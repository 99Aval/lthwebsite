<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% include 'base.html' %}

    <div class="contact-container">
        <h1>Contact Us</h1>
        <form action="" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <footer>
        <div class="footer-content">
            <p>Follow us on:</p>
            <a href="https://wa.me/yourwhatsapplink" target="_blank">
                <img src="{% static 'logos/whatsapp.svg' %}" alt="WhatsApp Logo">
            </a>
            <a href="https://facebook.com/yourfacebooklink" target="_blank">
                <img src="{% static 'logos/facebook.svg' %}" alt="Facebook Logo">
            </a>
        </div>
    </footer>
</body>
</html>
